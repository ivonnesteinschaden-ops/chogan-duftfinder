h1,h2{text-align:center}.muted{color:#666}.center{text-align:center}
button{font:inherit;border:0;border-radius:12px;padding:13px 18px;cursor:pointer}
.primary{background:#222;color:#fff}.secondary{background:#eee}
.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #ddd;margin:9px 0}
.option.selected{background:#f5e3df;border-color:#c77f70}
.check{float:right;opacity:.2}.selected .check{opacity:1}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.bar{height:7px;background:#ddd;border-radius:9px;overflow:hidden}.fill{height:100%;background:#222}
.result{margin-top:18px}.duft{border:1px solid #ddd;border-radius:14px;padding:15px;margin:10px 0}
.hidden{display:none}

let step=0, answers=[];
function begin(){document.getElementById("start").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");render()}
function render(){
 const q=questions[step], chosen=answers[step]||[], pct=Math.round((step+1)/questions.length*100);
 document.getElementById("counter").textContent=`Frage ${step+1} von ${questions.length}`;
 document.getElementById("fill").style.width=pct+"%";
 document.getElementById("question").textContent=q[0];
 const box=document.getElementById("options");box.innerHTML="";
 q[1].forEach((item,i)=>{
   const b=document.createElement("button");b.type="button";b.className="option"+(chosen.includes(i)?" selected":"");
   b.innerHTML=item[0]+' <span class="check">✓</span>';
   b.onclick=()=>{let a=answers[step]||[];a=a.includes(i)?a.filter(x=>x!==i):a.concat(i);answers[step]=a;render()};
   box.appendChild(b);
 });
 document.getElementById("back").disabled=step===0;
 document.getElementById("next").disabled=chosen.length===0;
 document.getElementById("next").textContent=step===questions.length-1?"✨ Meine Düfte finden":"Weiter →";
}
function previous(){if(step>0){step--;render()}}
function next(){if(!(answers[step]||[]).length)return;if(step<questions.length-1){step++;render()}else showResult()}
function showResult(){
 const score={};let genders=[];
 answers.forEach((arr,qi)=>(arr||[]).forEach(i=>{
   const v=questions[qi][1][i][1];
   if(qi===0)genders.push(v);else (Array.isArray(v)?v:[]).forEach(t=>score[t]=(score[t]||0)+1);
 }));
 const pool=genders.length?catalog.filter(x=>genders.includes(x[2])||x[2]==="U"):catalog;
 const ranked=pool.map(x=>({...x,score:x[3].reduce((s,t)=>s+(score[t]||0)*3,0)})).sort((a,b)=>b.score-a.score);
 const top=ranked.slice(0,3);
 const labels={fresh:"Frisch",clean:"Clean",floral:"Blumig",elegant:"Elegant",fruity:"Fruchtig",sweet:"Süß",vanilla:"Vanille",sensual:"Sinnlich",intense:"Intensiv",oriental:"Orientalisch",woody:"Holzig",spicy:"Würzig",warm:"Warm",citrus:"Zitrisch",powdery:"Pudrig",amber:"Amber",coffee:"Kaffee",aquatic:"Aquatisch",rose:"Rose",coconut:"Kokos",creamy:"Cremig",green:"Grün",dark:"Dunkel",leather:"Leder"};
 const profile=Object.entries(score).sort((a,b)=>b[1]-a[1]).slice(0,4).filter(x=>x[1]>0).map(x=>labels[x[0]]||x[0]).join(" • ");
 document.getElementById("quiz").classList.add("hidden");
 const r=document.getElementById("result");r.classList.remove("hidden");
 r.innerHTML=`<div class="card"><div class="center"><div style="font-size:50px">✨</div><div class="muted">DEIN DUFTPROFIL</div><h2>${profile||"Vielseitig"}</h2><p class="muted">Diese drei Chogan-Düfte passen anhand deiner Antworten am besten zu deinem Profil:</p></div>
 ${top.map((x,i)=>`<div class="duft"><strong>${i===0?"🥇":i===1?"🥈":"🥉"} Chogan Nr. ${x[0]}</strong><div style="font-size:19px;margin-top:5px">${x[1]}</div><div class="muted" style="margin-top:5px">${x[3].map(t=>labels[t]||t).join(" • ")}</div></div>`).join("")}

}
function restart(){step=0;answers=[];document.getElementById("result").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");render()}
